syntax = "proto3";

package authorization;

message Empty {}

message AccessCheckRequest {
  string user_id = 1;
  string domain = 2;
  string resource = 3;
  string action = 4;
}

message AccessCheckResponse {
  bool allowed = 1;
}

message RoleRequest {
  string user_id = 1;
  string domain = 2;
  string role = 3;
}

message GetRolesRequest {
  string user_id = 1;
  string domain = 2;
}

message RoleResponse {
  bool changed = 1;
  repeated string roles = 2;
}

message GetRolesResponse {
  repeated string roles = 1;
}

message HealthResponse {
  string status = 1;
}

service AuthorizationService {
  rpc CheckAccess(AccessCheckRequest) returns (AccessCheckResponse);
  rpc AssignRole(RoleRequest) returns (RoleResponse);
  rpc RemoveRole(RoleRequest) returns (RoleResponse);
  rpc GetRoles(GetRolesRequest) returns (GetRolesResponse);
  rpc Health(Empty) returns (HealthResponse);
}
