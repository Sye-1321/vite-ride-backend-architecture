syntax = "proto3";

package identity;

message Empty {}

message PaginationRequest {
  uint32 page = 1;
  uint32 limit = 2;
}

message PaginationMeta {
  uint32 page = 1;
  uint32 limit = 2;
  uint64 total = 3;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_PENDING = 1;
  USER_STATUS_ACTIVE = 2;
  USER_STATUS_SUSPENDED = 3;
  USER_STATUS_DEACTIVATED = 4;
}

enum UserVerificationPurpose {
  USER_VERIFICATION_UNSPECIFIED = 0;
  USER_VERIFICATION_ACCOUNT = 1;
  USER_VERIFICATION_PASSWORD_RESET = 2;
  USER_VERIFICATION_PHONE_CHANGE = 3;
}

message AuthTokens {
  string accessToken = 1;
  string refreshToken = 2;
}

message UserResponse {
  string id = 1;
  string firstName = 2;
  string lastName = 3;
  string phoneNumber = 4;
  UserStatus status = 5;
  string auditCreatedAt = 6;
  string auditCreatedBy = 7;
  string auditUpdatedAt = 8;
  string auditUpdatedBy = 9;
  bool isDeleted = 10;
}

message LoginRequest {
  string phoneNumber = 1;
  string password = 2;
}

message LoginResponse {
  UserResponse user = 1;
  AuthTokens tokens = 2;
}

message RefreshAccessTokenRequest {
  string userId = 1;
  string refreshToken = 2;
}

message RefreshAccessTokenResponse {
  string accessToken = 1;
}

message LogoutRequest {
  string userId = 1;
}


message RegisterUserRequest {
  string firstName = 1;
  string lastName = 2;
  string phoneNumber = 3;
  string password = 4;
}

message RegisterUserResponse {
  string verificationToken = 1;
}

message VerifyUserRequest {
  string verificationToken = 1;
  string otp = 2;
}

message RequestAccountVerificationRequest {
  string phoneNumber = 1;
}

message RequestAccountVerificationResponse {
  string verificationToken = 1;
}

message ResendVerificationRequest {
  string verificationToken = 1;
  UserVerificationPurpose purpose = 2;
}

message ChangePasswordRequest {
  string userId = 1;
  string currentPassword = 2;
  string newPassword = 3;
}

message RequestPasswordResetRequest {
  string phoneNumber = 1;
}

message RequestPasswordResetResponse {
  string verificationToken = 1;
}

message ConfirmPasswordResetRequest {
  string verificationToken = 1;
  string otp = 2;
  string newPassword = 3;
}

message RequestPhoneNumberChangeRequest {
  string userId = 1;
  string newPhoneNumber = 2;
  string currentPassword = 3;
}

message RequestPhoneNumberChangeResponse {
  string verificationToken = 1;
}

message ConfirmPhoneNumberChangeRequest {
  string verificationToken = 1;
  string otp = 2;
}

message UpdateMyProfileRequest {
  string userId = 1;
  optional string firstName = 2;
  optional string lastName = 3;
}

message DeactivateMyAccountRequest {
  string userId = 1;
}


message GetMyProfileRequest {
  string userId = 1;
}

message GetUserByIdRequest {
  string userId = 1;
}

message ListUsersRequest {
  PaginationRequest pagination = 1;
  UserStatus status = 2;
  bool isDeleted = 3;
}

message SearchUsersRequest {
  PaginationRequest pagination = 1;
  string phoneNumber = 2;
  string name = 3;
}

message PaginatedUsersResponse {
  repeated UserResponse data = 1;
  PaginationMeta meta = 2;
}

message CheckUserExistsByPhoneRequest {
  string phoneNumber = 1;
}

message CheckUserExistsByPhoneResponse {
  bool exists = 1;
}

message SuspendUserRequest {
  string userId = 1;
}

message UnsuspendUserRequest {
  string userId = 1;
}

message DeleteUserRequest {
  string userId = 1;
}

service UserService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshAccessToken(RefreshAccessTokenRequest) returns (RefreshAccessTokenResponse);
  rpc Logout(LogoutRequest) returns (Empty);

  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  rpc VerifyUser(VerifyUserRequest) returns (Empty);
  rpc RequestAccountVerification(RequestAccountVerificationRequest)
    returns (RequestAccountVerificationResponse);
  rpc ResendVerification(ResendVerificationRequest) returns (RegisterUserResponse);

  rpc ChangePassword(ChangePasswordRequest) returns (Empty);
  rpc RequestPasswordReset(RequestPasswordResetRequest)
    returns (RequestPasswordResetResponse);
  rpc ConfirmPasswordReset(ConfirmPasswordResetRequest) returns (Empty);

  rpc RequestPhoneNumberChange(RequestPhoneNumberChangeRequest)
    returns (RequestPhoneNumberChangeResponse);
  rpc ConfirmPhoneNumberChange(ConfirmPhoneNumberChangeRequest) returns (Empty);

  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (Empty);
  rpc DeactivateMyAccount(DeactivateMyAccountRequest) returns (Empty);

  rpc GetMyProfile(GetMyProfileRequest) returns (UserResponse);
  rpc GetUserById(GetUserByIdRequest) returns (UserResponse);
  rpc ListUsers(ListUsersRequest) returns (PaginatedUsersResponse);
  rpc SearchUsers(SearchUsersRequest) returns (PaginatedUsersResponse);
  rpc CheckUserExistsByPhone(CheckUserExistsByPhoneRequest)
    returns (CheckUserExistsByPhoneResponse);

  rpc SuspendUser(SuspendUserRequest) returns (Empty);
  rpc UnsuspendUser(UnsuspendUserRequest) returns (Empty);
  rpc DeleteUser(DeleteUserRequest) returns (Empty);
}
